services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: jobqa
      POSTGRES_PASSWORD: jobqa
      POSTGRES_DB: jobqa
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobqa"]
      interval: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://jobqa:jobqa@db:5432/jobqa
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - hf_cache:/root/.cache/huggingface   # model downloads survive restarts
      - emb_cache:/srv/emb_cache            # embedding cache survives restarts

volumes:
  pgdata:
  hf_cache:
  emb_cache:
