[alembic]
script_location = alembic
prepend_sys_path = .
# URL is injected from app settings inside env.py; this value is a fallback.
sqlalchemy.url = postgresql+psycopg2://jobqa:jobqa@db:5432/jobqa

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = [%(asctime)s] %(levelname)s %(message)s
datefmt = %H:%M:%S
